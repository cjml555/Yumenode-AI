name: Release Build (Push - Create Version Tag)

permissions:
  contents: write
  id-token: write # For Google Play signing

env:
  main_project_module: app
  playstore_name: ponko

on:
  push:
    tags:
      - 'v*' # Any tag starting with 'v' triggers release

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Version code (integer)'
        required: true
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest

    # `secrets` no se puede evaluar en un `if:`, así que se expone como env y
    # el paso se condiciona a esa variable.
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for version calculation

      # Extract version from tag or input
      - name: Set version info
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION_NAME="${{ github.event.inputs.version }}"
            VERSION_CODE="${{ github.event.inputs.version_code }}"
          elif [[ -n "${{ github.ref_name }}" ]]; then
            # Extract version from tag (v1.2.3 -> 1.2.3)
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
            # Calculate version code from version (e.g., 1.2.3 -> 10203)
            VERSION_CODE=$(echo "$VERSION_NAME" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
          else
            VERSION_NAME="0.0.0"
            VERSION_CODE=0
          fi
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          # Gradle mapea ORG_GRADLE_PROJECT_* a project properties, así que
          # todos los `./gradlew` de abajo (build, test, assemble, bundle)
          # compilan con la versión del tag sin tocar ficheros.
          echo "ORG_GRADLE_PROJECT_appVersionName=$VERSION_NAME" >> $GITHUB_ENV
          echo "ORG_GRADLE_PROJECT_appVersionCode=$VERSION_CODE" >> $GITHUB_ENV
          echo "Versión a compilar: $VERSION_NAME ($VERSION_CODE)"

      - name: Set current date
        run: echo "date_today=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Set repository name
        run: echo "repository_name=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_ENV

      - name: Set Up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1.6.0
        with:
          ndk-version: r29
          link-to-sdk: true

      # Firma: reconstruye el keystore desde los secrets y genera
      # keystore.properties (que está en .gitignore). Sin KEYSTORE_BASE64 el
      # paso se salta y el APK se publica sin firmar.
      - name: Set up signing keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          STRIPPED="$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')"
          echo "longitud sin espacios: ${#STRIPPED}"
          echo "caracteres invalidos (hasta 40): $(printf '%s' "$STRIPPED" | tr -d 'A-Za-z0-9+/=' | head -c 40)"
          echo "$STRIPPED" | tr -d '[:space:]' | base64 -d > ponko-release.jks || { echo "::error::KEYSTORE_BASE64 no decodifica"; exit 1; }
          {
            echo "storeFile=ponko-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > keystore.properties
          chmod 600 ponko-release.jks keystore.properties
          echo "Keystore listo ($(wc -c < ponko-release.jks) bytes)"

      - name: Clean and build
        run: ./gradlew clean build

      - name: Run tests
        run: ./gradlew test

      - name: Build Release APK
        run: ./gradlew :app:assembleFreeRelease :app:assemblePremiumRelease

      # La release v1.4.4 se publicó con versionName 1.4.3 porque el workflow
      # calculaba la versión y no la pasaba a Gradle. Esta comprobación corta
      # el job si vuelve a pasar: si el APK no lleva la versión del tag, no se
      # publica.
      - name: Verify APK version matches the tag
        env:
          EXPECTED: ${{ steps.version.outputs.version_name }}
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          AAPT2="$(ls -d "$SDK"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)"
          echo "aapt2: $AAPT2"
          shopt -s nullglob
          fail=0
          for apk in app/build/outputs/apk/free/release/*.apk \
                     app/build/outputs/apk/premium/release/*.apk; do
            line="$("$AAPT2" dump badging "$apk" | head -1)"
            echo "$apk → $line"
            case "$line" in
              *"versionName='$EXPECTED'"*) ;;
              *) echo "::error::$apk no lleva versionName=$EXPECTED"; fail=1 ;;
            esac
          done
          [ "$fail" -eq 0 ] || { echo "::error::APK con versión distinta a la del tag"; exit 1; }

      - name: Build App Bundle
        run: ./gradlew :app:bundleFreeRelease :app:bundlePremiumRelease

      - name: Upload APK Release
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.date_today }} - ${{ env.playstore_name }} - ${{ env.repository_name }} - Release APK
          path: |
            ${{ env.main_project_module }}/build/outputs/apk/free/release/*.apk
            ${{ env.main_project_module }}/build/outputs/apk/premium/release/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.date_today }} - ${{ env.playstore_name }} - ${{ env.repository_name }} - App Bundle AAB
          path: ${{ env.main_project_module }}/build/outputs/bundle/**/*.aab

      # List build outputs
      - name: List build outputs
        run: |
          ls -la ${{ env.main_project_module }}/build/outputs/apk/free/release/ 2>/dev/null || echo "No APK release files"
          ls -la ${{ env.main_project_module }}/build/outputs/apk/premium/release/ 2>/dev/null || echo "No APK release files"
          ls -la ${{ env.main_project_module }}/build/outputs/bundle/free/release/ 2>/dev/null || echo "No AAB files"
          ls -la ${{ env.main_project_module }}/build/outputs/bundle/premium/release/ 2>/dev/null || echo "No AAB files"

      # Commit version update if from tag
      - name: Commit version update
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VN: ${{ steps.version.outputs.version_name }}
          VC: ${{ steps.version.outputs.version_code }}
        run: |
          git config user.name '${{ github.actor }}'
          git config user.email '${{ github.actor }}@users.noreply.github.com'
          # Los defaults de app/build.gradle.kts pasan a ser la versión recién
          # publicada, para que un build local sin properties dé el mismo
          # versionName/versionCode que el APK de la release.
          python3 - <<'PY'
          import os, re, pathlib
          p = pathlib.Path("app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")
          s, n1 = re.subn(
              r'gradleProperty\("appVersionName"\)\.getOrElse\("[^"]*"\)',
              'gradleProperty("appVersionName").getOrElse("%s")' % os.environ["VN"], s)
          s, n2 = re.subn(
              r'gradleProperty\("appVersionCode"\)\.map\(String::toInt\)\.getOrElse\(\d+\)',
              'gradleProperty("appVersionCode").map(String::toInt).getOrElse(%s)' % os.environ["VC"], s)
          p.write_text(s, encoding="utf-8")
          print("defaults actualizados:", n1, n2)
          PY
          git add app/build.gradle.kts
          git commit -m "build: bump version to ${{ steps.version.outputs.version_name }} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:main || echo "Version push skipped"

      # Create GitHub Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ steps.version.outputs.version_name }}
          tag_name: v${{ steps.version.outputs.version_name }}
          generate_release_notes: true
          files: |
            ${{ env.main_project_module }}/build/outputs/apk/free/release/*.apk
            ${{ env.main_project_module }}/build/outputs/apk/premium/release/*.apk
            ${{ env.main_project_module }}/build/outputs/bundle/**/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
